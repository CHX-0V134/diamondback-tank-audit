<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0014DC" />
  <title>Tank Config Audit</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="stylesheet" href="css/leaflet.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Login -->
  <section id="login" class="screen center hidden">
    <div class="card auth-card">
      <div class="brand"><span class="brand-mark">SLB</span><span class="brand-name">Tank Config Audit</span></div>
      <p class="muted">Enter your approved work email to continue. No password or code needed.</p>
      <form id="login-form">
        <label for="email">Email</label>
        <input id="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" autocorrect="off"
               spellcheck="false" enterkeyhint="go" placeholder="you@slb.com" required />
        <button class="btn primary" type="submit" id="login-btn">Continue</button>
      </form>
      <p id="login-msg" class="msg" aria-live="polite"></p>
    </div>
  </section>

  <!-- Main app -->
  <div id="app" class="hidden">
    <div class="appbar">
      <header class="topbar">
        <div class="brand small"><span class="brand-mark">SLB</span><span class="brand-name">Tank Audit</span></div>
        <div class="topbar-actions">
          <button id="sync-btn" class="btn sync" title="Sync now">
            <span class="dot" id="net-dot"></span><span id="sync-label">Sync</span>
          </button>
          <button id="theme-btn" class="icon-btn" title="Toggle light/dark" aria-label="Toggle theme">◐</button>
          <button id="menu-btn" class="icon-btn" title="Account" aria-label="Account">≡</button>
        </div>
      </header>
      <div class="toolbar">
        <input id="search" type="search" enterkeyhint="search" autocapitalize="off" autocorrect="off" spellcheck="false"
               placeholder="Search well, accounting ID, tank ID, product…" />
        <select id="filter-foreman"><option value="">All foremen</option></select>
        <select id="filter-type"><option value="">All types</option></select>
        <select id="filter-status">
          <option value="">All</option>
          <option value="unreviewed">Needs review</option>
          <option value="reviewed">Reviewed</option>
        </select>
      </div>
    </div>

    <div id="offline-banner" class="offline-banner hidden">● Offline — changes are saved on this device and will sync automatically.</div>

    <div class="viewtoggle">
      <button id="view-list" class="seg on" type="button">List</button>
      <button id="view-map" class="seg" type="button">Map</button>
      <span class="map-legend" id="map-legend"></span>
    </div>

    <div id="account-menu" class="menu hidden">
      <div class="menu-email" id="menu-email"></div>
      <div class="menu-row" id="sync-detail"></div>
      <button class="btn ghost block" id="signout-btn">Sign out</button>
    </div>

    <main id="list" class="list"></main>
    <div id="empty" class="empty hidden">No tanks match your filters.</div>
    <div id="mapview" class="hidden">
      <div id="map"></div>
      <div id="map-unmapped" class="map-unmapped"></div>
    </div>
  </div>

  <!-- Per-tank map overlay -->
  <div id="tankmap" class="panel hidden" role="dialog" aria-modal="true"></div>

  <!-- Tank detail panel -->
  <div id="detail" class="panel hidden" role="dialog" aria-modal="true"></div>
  <div id="scrim" class="scrim hidden"></div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <script src="js/leaflet.js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/db.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
